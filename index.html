<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read to Earn - Kutubxona</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
        .auth-container {
            text-align: center;
            padding: 30px 10px;
        }
        .btn-primary {
            background-color: #24a1de;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(36,161,222,0.3);
            width: 100%;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .balance-badge {
            background: #e1f5fe;
            color: #0288d1;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
        }
        .item-card {
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            background: #fafafa;
            cursor: pointer;
            transition: 0.2s;
        }
        .item-card:hover {
            background: #f0f7ff;
            border-color: #24a1de;
        }
        .item-title {
            font-weight: bold;
            font-size: 16px;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .item-subtitle {
            font-size: 13px;
            color: #666;
        }
        .book-text {
            line-height: 1.7;
            font-size: 15px;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #eee;
            padding: 12px;
            border-radius: 8px;
            background: #fafafa;
        }
        .timer-box {
            text-align: center;
            font-weight: bold;
            color: #e67e22;
            font-size: 18px;
            margin: 15px 0;
        }
        .quiz-option {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fff;
            text-align: left;
            cursor: pointer;
        }
        .quiz-option:hover {
            background: #eef;
        }
    </style>
</head>
<body>

    <!-- TELEFON RAQAM SOHASI -->
    <div id="auth-screen" class="card auth-container">
        <h2>Xush kelibsiz! 👋</h2>
        <p>Tizimdan foydalanish va koin yig'ish uchun telefon raqamingizni tasdiqlang.</p>
        <br>
        <button id="request-phone-btn" class="btn-primary">
            📱 Telefon raqamni ulashish
        </button>
    </div>

    <!-- ASOSIY ILOVA SOHASI -->
    <div id="main-app" style="display: none;">
        <!-- HEADER -->
        <div class="card header-bar">
            <div><strong>Foydalanuvchi:</strong> <span id="username-display">...</span></div>
            <div class="balance-badge">💰 <span id="user-coins">0</span> Koin</div>
        </div>

        <!-- 1. KITOBLAR KATALOGI -->
        <div id="books-list-view" class="card">
            <h3>📚 Kitoblar katalogi</h3>
            <div id="books-container">Yuklanmoqda...</div>
        </div>

        <!-- 2. BOBLAR RO'YXATI -->
        <div id="chapters-list-view" class="card" style="display: none;">
            <button class="btn-secondary" onclick="showBooksList()">⬅️ Kitoblarga qaytish</button>
            <h3 id="selected-book-title">Kitob nomi</h3>
            <p id="selected-book-author" style="color: #666; font-size: 14px;"></p>
            <h4>Boblar:</h4>
            <div id="chapters-container">Yuklanmoqda...</div>
        </div>

        <!-- 3. KITOB O'QISH VA TEST EKRAMI -->
        <div id="reading-view" class="card" style="display: none;">
            <button class="btn-secondary" onclick="showChaptersList()">⬅️ Boblarga qaytish</button>
            <h3 id="reading-chapter-title">Bob nomi</h3>
            <div id="reading-content" class="book-text">
                Yuklanmoqda...
            </div>

            <div class="timer-box">
                ⏱️ Qolgan vaqt: <span id="timer-count">120</span> soniya
            </div>

            <!-- TEST BO'LIMI -->
            <div id="quiz-card" style="display: none; margin-top: 15px; border-top: 2px solid #eee; padding-top: 15px;">
                <h4 id="quiz-question">Savol yuklanmoqda...</h4>
                <div id="quiz-options-container"></div>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://read-to-earn-backend-6tvp3uw0l-kitob-hayot-chirog-i.vercel.app"; // O'zingizning backend havolangiz
        const tg = window.Telegram.WebApp;
        tg.expand();

        const tgUser = tg.initDataUnsafe?.user || { id: 12345678, username: "test_user" };

        let selectedBookId = null;
        let selectedChapterId = null;
        let currentSessionId = null;
        let timerSeconds = 120;
        let timerInterval = null;
        let heartbeatInterval = null;

        // Telefon raqam ulashish tugmasi
        document.getElementById('request-phone-btn').addEventListener('click', () => {
            if (tg.requestContact) {
                tg.requestContact((sent, response) => {
                    if (sent) {
                        const phoneNumber = response?.responseUnsafe?.contact?.phone_number || "998000000000";
                        registerUser(phoneNumber);
                    } else {
                        tg.showAlert("Raqamni tasdiqlamasdan ilovaga kirib bo'lmaydi.");
                    }
                });
            } else {
                registerUser("998901234567");
            }
        });

        // Foydalanuvchini ro'yxatdan o'tkazish/tekshirish
        async function registerUser(phoneNumber = null) {
            try {
                const res = await fetch(`${BACKEND_URL}/api/auth`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegram_id: tgUser.id,
                        username: tgUser.username || "Foydalanuvchi",
                        phone_number: phoneNumber
                    })
                });

                const data = await res.json();

                if (data.phone_number) {
                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('main-app').style.display = 'block';
                    document.getElementById('username-display').innerText = data.username || "Foydalanuvchi";
                    document.getElementById('user-coins').innerText = data.coins_balance;

                    loadBooks();
                } else {
                    document.getElementById('auth-screen').style.display = 'block';
                    document.getElementById('main-app').style.display = 'none';
                }
            } catch (err) {
                console.error("Auth xatosi:", err);
            }
        }

        // 1. KITOBLARNI YUKLASH
        async function loadBooks() {
            showBooksList();
            const container = document.getElementById('books-container');
            container.innerHTML = "Yuklanmoqda...";

            try {
                const res = await fetch(`${BACKEND_URL}/api/books`);
                const books = await res.json();

                container.innerHTML = "";
                books.forEach(book => {
                    const item = document.createElement('div');
                    item.className = 'item-card';
                    item.innerHTML = `
                        <div class="item-title">📖 ${book.title}</div>
                        <div class="item-subtitle">Muallif: ${book.author} | Boblar soni: ${book.chapters_count}</div>
                    `;
                    item.onclick = () => loadChapters(book);
                    container.appendChild(item);
                });
            } catch (err) {
                container.innerHTML = "Kitoblarni yuklashda xatolik yuz berdi.";
            }
        }

        // 2. BOBLARNI YUKLASH
        async function loadChapters(book) {
            selectedBookId = book.id;
            document.getElementById('books-list-view').style.display = 'none';
            document.getElementById('chapters-list-view').style.display = 'block';
            document.getElementById('reading-view').style.display = 'none';

            document.getElementById('selected-book-title').innerText = book.title;
            document.getElementById('selected-book-author').innerText = "Muallif: " + book.author;

            const container = document.getElementById('chapters-container');
            container.innerHTML = "Yuklanmoqda...";

            try {
                const res = await fetch(`${BACKEND_URL}/api/books/${book.id}/chapters`);
                const chapters = await res.json();

                container.innerHTML = "";
                chapters.forEach(ch => {
                    const item = document.createElement('div');
                    item.className = 'item-card';
                    item.innerHTML = `<div class="item-title">📌 ${ch.title}</div>`;
                    item.onclick = () => openChapter(ch.id);
                    container.appendChild(item);
                });
            } catch (err) {
                container.innerHTML = "Boblarni yuklashda xatolik yuz berdi.";
            }
        }

        // 3. BOBNI OCHISH VA O'QISH
        async function openChapter(chapterId) {
            selectedChapterId = chapterId;
            document.getElementById('chapters-list-view').style.display = 'none';
            document.getElementById('reading-view').style.display = 'block';
            document.getElementById('quiz-card').style.display = 'none';

            try {
                const res = await fetch(`${BACKEND_URL}/api/chapters/${chapterId}`);
                const chapter = await res.json();

                document.getElementById('reading-chapter-title').innerText = chapter.title;
                document.getElementById('reading-content').innerText = chapter.content;

                // Test ma'lumotlarini tayyorlash
                document.getElementById('quiz-question').innerText = chapter.question;
                const optionsContainer = document.getElementById('quiz-options-container');
                optionsContainer.innerHTML = "";
                chapter.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'quiz-option';
                    btn.innerText = opt;
                    btn.onclick = () => submitAnswer(idx);
                    optionsContainer.appendChild(btn);
                });

                // Sessiyani boshlash va taymerni yoqish
                startReadingSession(chapterId);

            } catch (err) {
                alert("Bob matnini yuklashda xatolik!");
            }
        }

        // SESSIYANI BOSHLASH
        async function startReadingSession(chapterId) {
            clearInterval(timerInterval);
            clearInterval(heartbeatInterval);
            timerSeconds = 120;
            document.getElementById('timer-count').innerText = timerSeconds;

            try {
                const res = await fetch(`${BACKEND_URL}/api/start-session`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegram_id: tgUser.id,
                        chapter_id: chapterId
                    })
                });

                const data = await res.json();
                currentSessionId = data.session_id;

                startTimer();
                startHeartbeat();
            } catch (err) {
                console.error("Sessiya xatosi:", err);
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timerSeconds--;
                document.getElementById('timer-count').innerText = timerSeconds;

                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('quiz-card').style.display = 'block';
                }
            }, 1000);
        }

        function startHeartbeat() {
            heartbeatInterval = setInterval(async () => {
                if (currentSessionId) {
                    await fetch(`${BACKEND_URL}/api/heartbeat`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            telegram_id: tgUser.id,
                            session_id: currentSessionId
                        })
                    });
                }
            }, 30000);
        }

        // TEST JAVOBINI YUBORISH
        async function submitAnswer(optionIndex) {
            try {
                const res = await fetch(`${BACKEND_URL}/api/claim-quiz`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegram_id: tgUser.id,
                        session_id: currentSessionId,
                        selected_answer: optionIndex
                    })
                });

                const data = await res.json();

                if (data.status === "success") {
                    tg.showAlert(`Tabriklaymiz! +${data.coins_earned} koin ishlandingiz!`);
                    document.getElementById('user-coins').innerText = data.new_balance;
                    document.getElementById('quiz-card').style.display = 'none';
                    clearInterval(heartbeatInterval);
                } else {
                    tg.showAlert(data.message || "Noto'g'ri javob!");
                }
            } catch (err) {
                console.error("Test xatosi:", err);
            }
        }

        // NAVIGATSIYA FUNKSIYALARI
        function showBooksList() {
            clearInterval(timerInterval);
            clearInterval(heartbeatInterval);
            document.getElementById('books-list-view').style.display = 'block';
            document.getElementById('chapters-list-view').style.display = 'none';
            document.getElementById('reading-view').style.display = 'none';
        }

        function showChaptersList() {
            clearInterval(timerInterval);
            clearInterval(heartbeatInterval);
            document.getElementById('books-list-view').style.display = 'none';
            document.getElementById('chapters-list-view').style.display = 'block';
            document.getElementById('reading-view').style.display = 'none';
        }

        // ILOWA ISHGA TUSHGANDA
        window.onload = () => {
            registerUser();
        };
    </script>
</body>
</html>
